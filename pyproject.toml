[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ableton-live-intro-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
    "ruff>=0.11",
]

[project.scripts]
ableton-upstream = "ableton_ctrl.upstream:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ableton_ctrl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src", "."]

