[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ableton-live-intro-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9,<2",
    "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
    "ruff>=0.11",
]

[project.scripts]
ableton-ctrl-bridge = "ableton_ctrl.bridge.server:main"
ableton-ctrl-mcp = "ableton_ctrl.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ableton_ctrl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
