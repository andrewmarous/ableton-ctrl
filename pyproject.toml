[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ableton-ctrl"
version = "0.1.0"
description = "Upstream AbletonMCP installation and production workflows for Pi."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ableton-ctrl/ableton-ctrl"
Repository = "https://github.com/ableton-ctrl/ableton-ctrl"
Issues = "https://github.com/ableton-ctrl/ableton-ctrl/issues"

[project.scripts]
ableton-upstream = "ableton_ctrl.upstream:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ableton_ctrl"]

[tool.hatch.build]
include = ["src/ableton_ctrl/**/*.py", "src/ableton_ctrl/**/*.json", "src/ableton_ctrl/**/*.ts", "src/ableton_ctrl/**/*.md", "src/ableton_ctrl/**/*.gitkeep"]

[dependency-groups]
dev = ["mypy>=1.15", "pytest>=8.3", "pytest-asyncio>=0.26", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src", "."]
