[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ableton-live-intro-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9,<2",
    "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
    "ruff>=0.11",
]

[project.scripts]
ableton-ctrl = "ableton_ctrl.cli:main"
ableton-ctrl-bridge = "ableton_ctrl.bridge.server:main"
ableton-ctrl-install-pi = "ableton_ctrl.pi_installer:main"
ableton-ctrl-mcp = "ableton_ctrl.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ableton_ctrl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src", "."]

[[tool.mypy.overrides]]
module = [
    "tests.contract.test_bridge_server",
    "tests.contract.test_end_to_end",
    "tests.contract.test_mcp_stdio",
    "tests.unit.test_adapter_runtime",
    "tests.unit.test_config",
    "tests.unit.test_contracts",
    "tests.unit.test_discovery",
    "tests.unit.test_live_smoke",
]
ignore_errors = true
