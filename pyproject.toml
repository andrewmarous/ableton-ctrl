[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ableton-ctrl"
version = "0.1.0"
description = "Read-only inspection of Ableton Live Sets through a local bridge."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["mcp>=1.9,<2", "pydantic>=2.11,<3"]

[project.urls]
Homepage = "https://github.com/ableton-ctrl/ableton-ctrl"
Repository = "https://github.com/ableton-ctrl/ableton-ctrl"
Issues = "https://github.com/ableton-ctrl/ableton-ctrl/issues"

[project.scripts]
ableton-ctrl = "ableton_ctrl.cli:main"
ableton-ctrl-bridge = "ableton_ctrl.bridge.server:main"
ableton-ctrl-install-pi = "ableton_ctrl.pi_installer:main"
ableton-ctrl-mcp = "ableton_ctrl.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ableton_ctrl"]

[tool.hatch.build]
include = ["src/ableton_ctrl/**/*.py", "src/ableton_ctrl/**/*.json", "src/ableton_ctrl/**/*.ts", "src/ableton_ctrl/**/*.md", "src/ableton_ctrl/**/*.gitkeep"]

[dependency-groups]
dev = ["mypy>=1.15", "pytest>=8.3", "pytest-asyncio>=0.26", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src", "."]

[[tool.mypy.overrides]]
module = ["tests.contract.test_bridge_server", "tests.contract.test_end_to_end", "tests.contract.test_mcp_stdio", "tests.unit.test_adapter_runtime", "tests.unit.test_config", "tests.unit.test_contracts", "tests.unit.test_discovery", "tests.unit.test_live_smoke", "tests.unit.test_store"]
ignore_errors = true
