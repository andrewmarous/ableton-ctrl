[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ableton-video-transcribe"
version = "0.1.0"
description = "Local CUDA transcription for development workflows"
requires-python = ">=3.11,<3.14"
dependencies = [
    "faster-whisper>=1.1,<2",
    "ctranslate2>=4.5,<5",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12>=12,<13",
    "nvidia-cudnn-cu12>=9,<10",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11"]

[project.scripts]
video-transcribe = "video_transcribe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video_transcribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
